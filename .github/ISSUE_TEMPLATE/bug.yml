name: Bug report
description: Report a reproducible defect without disclosing a vulnerability
title: "fix: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, personal data, or vulnerability details. Follow SECURITY.md for sensitive findings.
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Include deterministic steps and sanitized inputs.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, runtime, browser, database, and deployment mode as relevant.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Logs or screenshots with secrets and personal data removed.
  - type: textarea
    id: regression
    attributes:
      label: Regression test
      description: Describe the test that should prevent recurrence.
